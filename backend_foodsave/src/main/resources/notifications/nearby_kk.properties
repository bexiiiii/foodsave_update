walk.start=Осы чатта қыстырғышты басып, геолокацияңызды тікелей бөлісуді қосыңыз. Бір сағат ішінде маңайыңызда қолжетімді бокс табылса, бір хабарлама жіберемін. Геолокацияны бөлісуді кез келген уақытта тоқтата аласыз.
walk.open=Алдымен FoodSave Mini App қолданбасын ашып, профиліңізге кіріңіз. Содан кейін «Жолай бокс табу» түймесін басыңыз.
walk.muted=Бокстар туралы хабарламалар өшірулі. Оларды FoodSave профилінде қосып, «Жолай бокс табу» түймесін қайта баса аласыз.
